<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Додати наказ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body {
      background: #f3f4f6;
      color: #1f2937;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 2rem;
    }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      max-width: 500px;
      margin: 2rem auto;
    }
    h1 {
      color: #10b981;
      font-weight: 600;
      text-align: center;
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: #374151;
    }
    input[type="file"], select, input[type="date"] {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 1rem;
    }
    .btn {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      font-weight: 600;
      text-align: center;
      transition: all 0.3s;
      margin-top: 0.5rem;
      cursor: pointer;
    }
    .btn-primary {
      background: #10b981;
      color: white;
      border: none;
    }
    .btn-primary:hover {
      background: #059669;
    }
    .btn-secondary {
      background: #6b7280;
      color: white;
      border: none;
      text-decoration: none;
      display: block;
    }
    .btn-secondary:hover {
      background: #4b5563;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Додати наказ</h1>

    <form id="orderForm" action="javascript:void(0)">
      <div>
        <label for="orderFile">Файл (.docx):</label>
        <input type="file" id="orderFile" accept=".docx" required>
      </div>
      <div>
        <label for="orderStatus">Статус:</label>
        <select id="orderStatus" required>
          <option value="Активний">Активний</option>
          <option value="Виконаний">Виконаний</option>
          <option value="Архів">Архів</option>
        </select>
      </div>
      <div>
        <label for="orderDeadline">Дедлайн (не обов’язково):</label>
        <input type="date" id="orderDeadline">
      </div>
      <button type="submit" class="btn btn-primary">Зберегти наказ</button>
      <a href="/index.html" class="btn btn-secondary">Назад до списку</a>
    </form>
  </div>

  <script>
    document.getElementById('orderForm').onsubmit = async (e) => {
      e.preventDefault();

      const file = document.getElementById('orderFile').files[0];
      const status = document.getElementById('orderStatus').value;
      const deadline = document.getElementById('orderDeadline').value;

      if (!file) return alert('Виберіть файл .docx');
      if (!file.name.toLowerCase().endsWith('.docx')) return alert('Тільки .docx');

      const user = JSON.parse(localStorage.getItem('loggedInUser') || '{}');
      if (!user.id) {
        alert('Увійдіть у систему!');
        location.href = '/login.html';
        return;
      }

      const formData = new FormData();
      formData.append('file', file);
      formData.append('status', status);
      if (deadline) formData.append('deadline', deadline);

      try {
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'X-User-Id': user.id },
          body: formData
        });
        const data = await res.json();
        if (res.ok) {
          alert('Наказ додано!');
          location.href = '/index.html';
        } else {
          alert(data.error || 'Помилка');
        }
      } catch (err) {
        alert('Сервер не відповідає');
      }
    };
  </script>
</body>
</html>
