<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Додати наказ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="/auth-helper.js"></script>

  <style>
    body { background: #f3f4f6; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
    .card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      padding: 2.5rem;
      max-width: 600px;
      margin: 3rem auto;
    }
    h1 {
      text-align: center;
      color: #16a34a;
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 2rem;
    }
    label {
      display: block;
      margin: 1.2rem 0 0.5rem;
      font-weight: 600;
      color: #1f2937;
    }
    input, select {
      width: 100%;
      padding: 0.9rem;
      border: 2px solid #d1d5db;
      border-radius: 12px;
      font-size: 1rem;
      transition: all 0.3s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #16a34a;
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.1);
    }
    .btn {
      margin-top: 2rem;
      padding: 1rem;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.3s;
      width: 100%;
    }
    .btn-primary {
      background: #16a34a;
      color: white;
      border: none;
    }
    .btn-primary:hover {
      background: #15803d;
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: #6b7280;
      color: white;
      text-decoration: none;
      text-align: center;
      display: block;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Додати новий наказ</h1>

    <form id="orderForm">
      <div>
        <label for="file">Файл наказу (.docx)</label>
        <input type="file" id="file" accept=".docx" required>
      </div>

      <div>
        <label for="status">Статус</label>
        <select id="status" required>
          <option value="Активний">Активний</option>
          <option value="Виконаний">Виконаний</option>
          <option value="Архів">Архів</option>
        </select>
      </div>

      <div>
        <label for="deadline">Дедлайн (не обов’язково)</label>
        <input type="date" id="deadline">
      </div>

      <button type="submit" class="btn btn-primary">
        Зберегти наказ
      </button>
    </form>

    <a href="/index.html" class="btn btn-secondary">Назад до списку</a>
  </div>

  <script>
    if (!window.user) {
      alert('Потрібна авторизація');
      location.href = '/login.html';
    }

    document.getElementById('orderForm').onsubmit = async (e) => {
      e.preventDefault();

      const file = document.getElementById('file').files[0];
      if (!file) return alert('Виберіть файл .docx');
      if (!file.name.toLowerCase().endsWith('.docx')) return alert('Тільки .docx файли!');

      const formData = new FormData();
      formData.append('file', file);
      formData.append('status', document.getElementById('status').value);
      const deadline = document.getElementById('deadline').value;
      if (deadline) formData.append('deadline', deadline);

      try {
        const res = await fetch('/api/orders', {
          method: 'POST',
          body: formData
        });

        if (res.ok) {
          alert('Наказ успішно додано!');
          setTimeout(() => location.href = '/index.html', 800);
        } else {
          const err = await res.text();
          alert('Помилка: ' + err);
        }
      } catch (err) {
        console.error(err);
        alert('Сервер не відповідає');
      }
    };
  </script>
</body>
</html>
