<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Реєстрація — Система обліку наказів</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    body {
      background: linear-gradient(to bottom, #f0f4f0 0%, #d0e0d0 100%);
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #2d6a4f;
      color: white;
      padding: 1.5rem;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .footer {
      background: #2d6a4f;
      color: white;
      text-align: center;
      padding: 1rem;
      margin-top: auto;
      font-size: 0.9rem;
    }
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
    }
    .input-wrapper {
      position: relative;
      margin-bottom: 1.5rem;
    }
    .input-wrapper i {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #4b5563;
      font-size: 1.3rem;
      pointer-events: none;
    }
    .input-wrapper input {
      width: 100%;
      padding: 16px 16px 16px 58px;
      border: 2px solid #d1d5db;
      border-radius: 12px;
      font-size: 1.05rem;
      background: #f9fafb;
      transition: all 0.3s;
    }
    .input-wrapper input:focus {
      outline: none;
      border-color: #16a34a;
      box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.15);
    }
    button {
      width: 100%;
      padding: 16px;
      background: #1e40af;
      color: white;
      font-weight: 600;
      font-size: 1.15rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover { background: #1d3a94; }
  </style>
</head>
<body>

  <header class="header">
    <h1 class="text-2xl font-bold">Система обліку наказів</h1>
    <p class="text-sm opacity-90">Військовий інститут телекомунікацій та інформатизації</p>
  </header>

  <main class="flex-1 flex items-center justify-center p-6">
    <div class="card">
      <h2 class="text-2xl font-bold text-center mb-10 text-gray-800">Реєстрація</h2>
      
      <form id="registerForm">
        <div class="input-wrapper">
          <i class="fas fa-user"></i>
          <input type="text" id="name" placeholder="" required />
        </div>
        
        <div class="input-wrapper">
          <i class="fas fa-envelope"></i>
          <input type="email" id="email" placeholder="" required />
        </div>
        
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" placeholder="" required />
        </div>
        
        <button type="submit">Зареєструватися</button>
      </form>

      <p class="text-center mt-8 text-sm text-gray-600">
        Вже є акаунт? <a href="/login.html" class="text-blue-600 font-medium hover:underline">Увійти</a>
      </p>
    </div>
  </main>

  <footer class="footer">
    © 2025 ВІТІ ім. Героїв Крут. Всі права захищено.
  </footer>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!name || !email || !password) return alert('Заповніть усі поля!');

      try {
        const res = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Помилка реєстрації');

        localStorage.setItem('user', JSON.stringify(data.user));
        alert('Реєстрація успішна!');
        window.location.href = '/index.html';
      } catch (err) {
        alert(err.message);
      }
    });
  </script>
</body>
</html>
