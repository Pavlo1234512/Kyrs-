<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Редагувати наказ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="/auth-helper.js"></script>

  <style>
    body { background: #f3f4f6; font-family: 'Segoe UI', sans-serif; padding: 2rem; }
    .card { background: white; border-radius: 16px; padding: 2rem; max-width: 600px; margin: 2rem auto; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    h1 { color: #1f2937; text-align: center; margin-bottom: 1.5rem; font-size: 1.8rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #374151; }
    input, select { width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 8px; margin-bottom: 1rem; font-size: 1rem; }
    .btn { padding: 0.75rem 1.5rem; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin: 0.5rem 0; width: 100%; transition: background 0.3s; }
    .btn-primary { background: #16a34a; color: white; }
    .btn-primary:hover { background: #15803d; }
    .btn-secondary { background: #6b7280; color: white; text-decoration: none; display: block; text-align: center; }
    .btn-secondary:hover { background: #4b5563; }
    .current-file { font-size: 0.9rem; color: #16a34a; font-weight: 500; margin-top: -0.5rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Редагувати наказ</h1>
    <form id="editForm">
      <div>
        <label>Новий файл (.docx) — залишити старий або замінити:</label>
        <input type="file" id="file" accept=".docx">
        <div class="current-file">Поточний файл: <span id="fileName">завантажується...</span></div>
      </div>
      <div>
        <label>Статус:</label>
        <select id="status" required>
          <option value="Активний">Активний</option>
          <option value="Виконаний">Виконаний</option>
          <option value="Архів">Архів</option>
        </select>
      </div>
      <div>
        <label>Дедлайн:</label>
        <input type="date" id="deadline">
      </div>
      <button type="submit" class="btn btn-primary">Зберегти зміни</button>
      <a href="/index.html" class="btn btn-secondary">Скасувати</a>
    </form>
  </div>

  <script>
    // Перевірка авторизації через auth-helper.js
    if (!window.user || !window.user.id) {
      alert('Увійдіть у систему!');
      location.href = '/login.html';
    }

    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('id');
    const authUserId = window.user.id; // з auth-helper.js

    if (!orderId) {
      alert('ID наказу не знайдено');
      location.href = '/index.html';
    }

    // Завантаження даних наказу
    async function loadOrder() {
      try {
        const res = await fetch(`/api/orders/${orderId}?authUserId=${authUserId}`);
        const order = await res.json();

        document.getElementById('fileName').textContent = order.title + '.docx';
        document.getElementById('status').value = order.status || 'Активний';
        if (order.deadline) {
          document.getElementById('deadline').value = new Date(order.deadline).toISOString().split('T')[0];
        }
      } catch (err) {
        alert('Не вдалося завантажити наказ');
        location.href = '/index.html';
      }
    }
    loadOrder();

    // Збереження змін
    document.getElementById('editForm').onsubmit = async (e) => {
      e.preventDefault();

      const fileInput = document.getElementById('file');
      const file = fileInput.files[0];

      if (file && !file.name.toLowerCase().endsWith('.docx')) {
        return alert('Дозволено лише .docx файли');
      }

      const formData = new FormData();
      if (file) formData.append('file', file);
      formData.append('status', document.getElementById('status').value);
      const deadline = document.getElementById('deadline').value;
      if (deadline) formData.append('deadline', deadline);

      try {
        const res = await fetch(`/api/orders/${orderId}?authUserId=${authUserId}`, {
          method: 'PUT',
          body: formData
        });

        const data = await res.json();

        if (res.ok && (data.success || res.status === 200)) {
          alert('Наказ успішно відредаговано!');
          location.href = '/index.html'; // ВІДРАЗУ НА ГОЛОВНУ!
        } else {
          alert(data.error || 'Помилка збереження');
        }
      } catch (err) {
        alert('Сервер не відповідає');
      }
    };
  </script>

  <script src="sidebar.js"></script>
</body>
</html>
